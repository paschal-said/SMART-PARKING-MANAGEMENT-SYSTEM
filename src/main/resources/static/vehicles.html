<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>ParkBay - My vehicles</title>
</head>
<body>
<nav class="nav">
  <a class="nav-brand" href="index.html"><span class="mark">P</span> ParkBay</a>
  <div class="nav-links"></div>
  <button class="nav-account" id="accountBtn"></button>
</nav>
<div class="page-header"><div class="page-header-inner"><h1>My vehicles</h1><div class="sub">The gate camera matches your number plate to the vehicles saved here.</div></div></div>
<div class="section">
  <form class="booking-panel" id="vehForm" novalidate>
    <h3>Add a vehicle</h3><div class="sub">Letters and digits only, spaces are ignored.</div>
    <div class="form-two">
      <div class="form-row"><label for="plateInput">Number plate</label><input type="text" id="plateInput" placeholder="e.g. T 123 ABC" required></div>
      <div class="form-row"><label for="vehicleType">Vehicle type</label><select id="vehicleType"><option>Car</option><option>SUV</option><option>Motorcycle</option><option>Van</option></select></div>
    </div>
    <div class="form-row"><label for="modelInput">Model (optional)</label><input type="text" id="modelInput" placeholder="e.g. Toyota Corolla"></div>
    <div class="form-error" id="formError"></div>
    <button class="confirm-btn" type="submit">Save vehicle</button>
  </form>
  <div class="section-head" style="margin-top:36px"><h2>Registered vehicles</h2><span class="count" id="vehCount"></span></div>
  <div class="booking-list" id="vehList"></div>
</div>
<footer>ParkBay: PSSSF Commercial Complex, Sinza, Dar es Salaam.</footer>
<div class="toast" id="toast"></div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/vehicles.js"></script>
</body>
</html>
